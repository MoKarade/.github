name: Rapport hebdomadaire

# Rapport de la semaine pour les dix dépôts (plan de standardisation, décision 14) : vitesse (PR fusionnées,
# durée médiane ouverture → fusion, temps de CI), qualité (workflows rouges et retour au vert, conformité de
# la grille), santé du backlog (issues ouvertes, en-cours, sans mission). Le premier lundi du mois s'ajoute la
# revue de la grille. Le résultat est UNE issue `rapport` titrée « Rapport de la semaine du AAAA-MM-JJ » dans ce
# dépôt (relancer le workflow la met à jour, il n'en crée pas deux) et le résumé du job.
# La logique est dans scripts/rapport-hebdo.mjs (testée) ; ce fichier ne fait que l'appeler.
#
# Ce que le rapport ne mesure PAS, et le dit : les dépôts privés (CarAI, DriveAI, MemoryAI : le jeton du job ne
# les lit pas), les métriques Vercel (aucun jeton), les tests instables (aucune source). Un chiffre absent s'affiche
# « non mesuré », jamais 0.
#
# Lundi 10:17 UTC = 6 h 17 au Québec en heure d'été, 5 h 17 en heure normale (à corriger au 1er novembre si besoin).
# Minute 17, jamais 0 : GitHub laisse tomber les planifications des heures rondes (voir reacteur.yml, .github#143).
on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rapport-hebdo
  cancel-in-progress: false

jobs:
  rapport:
    name: Rapport hebdomadaire
    timeout-minutes: 30
    runs-on: ubuntu-latest # dépôt public : machines GitHub (gratuites)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # La grille de conformité de chaque dépôt PUBLIC lisible. Un dépôt privé ne se clone pas sans jeton : il
      # est sauté ici et le rapport l'affiche « non mesuré ».
      - name: Lire la grille de conformité des dépôts publics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          mkdir -p conformite clones
          for depot in .github app-template batchchef- FinanceAI hub-contract Hubperso JobAI; do
            if ! git clone --quiet --depth 1 "https://github.com/MoKarade/${depot}.git" "clones/${depot}" 2>/dev/null; then
              echo "::notice title=Conformité::${depot} non lisible, sautée"
              continue
            fi
            racine=.
            if [ "${depot}" = "batchchef-" ]; then racine=web; fi
            CONFORMITE_RACINE="${racine}" node scripts/conformite.mjs "clones/${depot}" "MoKarade/${depot}" --json > "conformite/${depot}.json" \
              || { echo "::notice title=Conformité::${depot} illisible, sautée"; rm -f "conformite/${depot}.json"; }
          done

      - name: Composer le rapport
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAPPORT_CONFORMITE_DIR: conformite
        run: node scripts/rapport-hebdo.mjs
