name: Tests de la relecture IA

# Les tests de la relecture IA (scripts/relecture-ia.mjs et relecture-regles.mjs) et de la lecture de son statut par le
# garde-fou : aucun réseau, aucune dépendance. Aucun `paths:` : un contrôle exigé filtré ne tournerait pas.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-relecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests de la relecture IA
    timeout-minutes: 5
    runs-on: ubuntu-latest # dépôt public : machines GitHub (gratuites)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node --test scripts/relecture-ia.test.mjs
