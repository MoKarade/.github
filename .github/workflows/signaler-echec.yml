name: Signaler un échec

# Un échec de pilotage devient une issue `boucle:erreur`, donc une barre dans les graphes du chantier (docs/boucle-erreur.md,
# MoKarade/.github#703 et #714). Demande de Marc, 28/10/2026 : « rien ne se perd, aucun oubli, aucune erreur inconnue ».
# Déclencheur : la FIN d'un workflow de pilotage (`workflow_run`), jamais un minuteur. Le même fichier sert aux autres dépôts : leur `reacteur.yml`
# l'appelle (`workflow_call`), et l'issue s'ouvre dans le dépôt où l'échec a eu lieu, avec le jeton de CE dépôt.
# Le signalement ne se signale pas lui-même (il n'est pas dans la liste ci-dessous) et un signalement qui échoue n'est qu'un avertissement.
# SÛRETÉ : les données du run (nom, lien, commit) arrivent par `env`, jamais dans la commande ; le texte écrit dans l'issue est nettoyé
# (scripts/boucle-erreur.mjs) et ne contient que des noms de job et d'étape, jamais un journal.
on:
  workflow_run:
    workflows: [Réacteur, Commentaire tâche liée, Relecture IA, Surveillance des apps]
    types: [completed]
  workflow_call:

# Aucun `paths:` : la règle vaut partout ici.
permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: signaler-echec-${{ github.repository }}-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  signaler:
    name: Signaler un échec
    # Annulé ou ignoré ne dit rien ; seuls un échec (ouvre ou commente) et un succès (ferme) comptent.
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    runs-on: ubuntu-latest # dépôt public : machines GitHub (gratuites)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MoKarade/.github
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Ouvrir, noter ou fermer l'issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOUCLE_DEPOT: ${{ github.repository }}
          BOUCLE_WORKFLOW: ${{ github.event.workflow_run.name }}
          BOUCLE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BOUCLE_RUN_ID: ${{ github.event.workflow_run.id }}
          BOUCLE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          BOUCLE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/boucle-erreur.mjs
