name: Commentaire tâche liée

# Pose, met à jour ou lève le commentaire « tâche liée » sur les PR ouvertes des dix dépôts (scripts/commenter-tache-liee.mjs).
# Pourquoi ici : le jeton des workflows du Garde-fou n'a pas `pull-requests: write` (HTTP 403) ; le jeton fin
# RELECTURE_PAT (Pull requests en lecture et écriture sur les dix dépôts, voir docs/relecture-ia.md) le peut, et un
# seul fichier remplace dix PR sur des chemins protégés. Ce workflow ne change jamais le verdict : le contrôle requis
# reste le « Garde-fou ».
#
# Déclencheurs : le Réacteur (reacteur.yml des dix dépôts, workflow commun reveil-reacteur.yml) le lance à l'ouverture, à la
# réouverture, à la sortie du brouillon et à la modification du corps d'une PR (type `pr_ouverte`), puis à chaque PR fusionnée,
# CI rouge ou tâche fermée. Il ne reste qu'un filet quotidien : GitHub espaçait fortement l'ancienne planification toutes les
# 10 minutes de ce dépôt (aucun passage en 73 min le 16/10/2026) et elle coûtait 144 passages par jour pour presque rien
# (MoKarade/.github#625). Minute décalée, jamais ronde : GitHub retarde surtout les planifications des minutes rondes.
# SÛRETÉ : le script vient de la branche main de ce dépôt et ne lit que le corps des PR (une donnée) ; ce fichier
# fait partie de ce que le garde-fou refuse de laisser modifier seul.
on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

# Aucun `paths:` : la règle vaut partout ici.
permissions:
  contents: read

concurrency:
  group: commentaire-tache-liee
  cancel-in-progress: false

jobs:
  commenter:
    name: Commentaire tâche liée
    # Plafond : une passe lit quelques dizaines de PR ; un job figé ne doit pas tourner six heures.
    timeout-minutes: 5
    runs-on: ubuntu-latest # dépôt public : machines GitHub (gratuites)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Commenter les PR sans tâche
        env:
          GH_PAT: ${{ secrets.RELECTURE_PAT }}
        run: node scripts/commenter-tache-liee.mjs
