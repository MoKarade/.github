name: Réacteur

# Réveille le Coordinateur (projet Apps de Marc), sans IA, quand une PR est
# fusionnée, quand la CI d'une branche devient rouge ou quand une tâche (issue `niveau:tâche`) est
# fermée (acceptée ou abandonnée : la fusion ne ferme plus l'issue, c'est la preuve qui la ferme),
# au lieu d'un relevé toutes les X heures.
# Plan : MoKarade/.github#42 et #139. Le workflow commun reveil-reacteur.yml (MoKarade/.github) lit le secret du dépôt
# qui lance le réveil (jamais dans le code) ; plus aucun appel à une routine, donc plus de quota Claude.
# Le message envoyé ne contient que des identifiants (dépôt, numéro de PR, empreinte), jamais un
# titre ni un nom de branche : tout ce qui vient d'un tiers reste hors du texte.
# Une tâche fermée ne réveille le Coordinateur que si le garde-fou de preuve (MoKarade/.github, cycle de vie §10 bis)
# valide la fermeture ; sans preuve valide il rouvre l'issue et personne n'est réveillé.
# PR ouverte (MoKarade/.github#157) : le même workflow commun ne réveille personne, il lance seulement le commentaire tâche liée,
# qui marque `en-cours` la tâche citée par la PR (la prise est tracée par la machine, pas par la mémoire du fil).
# Filet quotidien (MoKarade/.github#143 et #194) : deux passages par jour, à toute heure (aucune garde d'heure), le même workflow
# commun relit le dépôt avec le jeton du job (PR rouge depuis plus de 30 min, incident ouvert, branche par défaut rouge) et ne
# réveille que s'il y a un signal qui n'a pas déjà été posté sur la boîte dans les 6 dernières heures.
# Phase 4, « rien ne dépend d'un minuteur » (tâche MoKarade/.github#712, demande de Marc du 28/10/2026) : plus de `schedule` ici. Chaque chose qui devait attendre
# une passe a son événement : une tâche qui s'ouvre, change ou perd une étiquette (`tache_ouverte`), un
# déploiement de production réussi (`deploiement` : la tâche de la PR fusionnée s'accepte seule), un commentaire (`commentaire` : une preuve différée due se lit),
# la fin d'un cron d'app (`repository_dispatch` `fin-de-cron`), une note de LIA (`note-lia`). Le filet (`filet`) ne part plus que sur `workflow_dispatch` ou sur un
# `repository_dispatch` `filet` : le battement externe de la tâche #720 sera le seul minuteur, et il vit hors de GitHub.
# `check_suite` et `merge_group` ne sont pas écoutés : la fin d'un contrôle passe déjà par `workflow_run` (CI, Garde-fou) et Mergify fait seul sa file ; ils n'auraient
# rien à décider de plus.
on:
  pull_request:
    types: [closed, opened, reopened, ready_for_review, edited]
  workflow_run:
    # `Garde-fou` : un échec lance la relecture IA (type garde_fou_rouge, MoKarade/.github#633), sans réveiller personne.
    workflows: [CI, Garde-fou]
    types: [completed]
  issues:
    types: [closed, opened, edited, labeled, unlabeled]
  deployment_status:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [fin-de-cron, note-lia, filet]
  workflow_dispatch:

# Une rafale d'étiquettes ou de modifications sur la même tâche ne lance qu'un passage (le dernier) ; la fermeture a son propre groupe et n'est jamais annulée.
concurrency:
  group: reacteur-${{ github.event_name == 'issues' && format('issue-{0}-{1}', github.event.issue.number, github.event.action == 'closed' && 'closed' || 'maj') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'issues' && github.event.action != 'closed' }}

permissions: {}

jobs:
  preuve:
    name: Garde-fou de preuve
    # Seules les issues `niveau:tâche` comptent ; chantiers et missions n'ont pas de preuve de ce type.
    if: github.event_name == 'issues' && github.event.action == 'closed' && contains(github.event.issue.labels.*.name, 'niveau:tâche')
    permissions:
      contents: read
      issues: write
      pull-requests: read
      deployments: read
      actions: read
    uses: ./.github/workflows/preuve.yml
    with:
      numero: ${{ github.event.issue.number }}
      runner: ${{ github.event.repository.visibility == 'public' && '"ubuntu-latest"' || '["self-hosted","pc-marc"]' }}
      deploiement: aucun

  reveiller:
    name: Réveiller le Coordinateur
    needs: preuve
    # PR fusionnée, CI rouge hors robots (Dependabot : c'est Marc qui fusionne), ou tâche fermée ET prouvée
    # (seules les issues `niveau:tâche` libèrent une app, et seulement si le garde-fou a validé la fermeture).
    if: >-
      always() && (
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.actor.type != 'Bot') ||
      (github.event_name == 'issues' && github.event.action == 'closed' && contains(github.event.issue.labels.*.name, 'niveau:tâche') && contains(fromJSON('["acceptee","abandon"]'), needs.preuve.outputs.statut)) ||
      (github.event_name == 'issues' && github.event.action != 'closed' && contains(github.event.issue.labels.*.name, 'niveau:tâche')) ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && contains(github.event.issue.labels.*.name, 'preuve-attendue')) ||
      github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      # write : le commentaire « Fusionnée et acceptée automatiquement » sur la PR (tâche MoKarade/.github#418)
      pull-requests: write
      issues: write
      checks: read
      actions: write
      deployments: read
    # Workflow commun de MoKarade/.github (tâche MoKarade/.github#139) : filtre, relance une fois un échec de charge du
    # robot, puis lance boite-reacteur.yml. Le jeton de réveil (secret du dépôt) lui est transmis sans être nommé ici.
    uses: ./.github/workflows/reveil-reacteur.yml
    secrets: inherit
    with:
      runner: ${{ github.event.repository.visibility == 'public' && '"ubuntu-latest"' || '["self-hosted","pc-marc"]' }}
      type: >-
        ${{ github.event_name == 'pull_request' && (github.event.action == 'closed' && 'pr_fusionnee' || 'pr_ouverte')
        || github.event_name == 'issues' && (github.event.action == 'closed' && 'tache_fermee' || 'tache_ouverte')
        || github.event_name == 'workflow_run' && (github.event.workflow_run.name == 'Garde-fou' && 'garde_fou_rouge' || 'ci_rouge')
        || github.event_name == 'deployment_status' && 'deploiement'
        || github.event_name == 'issue_comment' && 'commentaire'
        || github.event_name == 'repository_dispatch' && (github.event.action == 'fin-de-cron' && 'fin_de_cron' || github.event.action == 'note-lia' && 'note_lia' || 'filet')
        || 'filet' }}
      depot: ${{ github.repository }}
      pr: ${{ format('{0}', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number) }}
      issue: ${{ format('{0}', github.event.issue.number) }}
      # Identifiant envoyé par l'app (`client_payload.note` ou `client_payload.cron`) : le script n'en garde que lettres, chiffres, point, tiret, souligné.
      signal: ${{ format('{0}', github.event.client_payload.note || github.event.client_payload.cron) }}
      raison: ${{ github.event.issue.state_reason }}
      evenement: ${{ github.event.workflow_run.event }}
      sha: ${{ github.event.workflow_run.head_sha || github.event.deployment.sha }}
      run: ${{ format('{0}', github.event.workflow_run.id) }}
      branche-run: ${{ github.event.workflow_run.head_branch }}
      branche-defaut: ${{ github.event.repository.default_branch }}
      # .github ne se déploie nulle part (comme son garde-fou de preuve ci-dessus) : sans cela l'acceptation automatique attend
      # un déploiement Vercel qui n'existera jamais et laisse la tâche à un fil (essai réel du 21/10/2026, .github#402).
      deploiement: aucun
      forcer: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' && github.event.action == 'filet') && 'true' || '' }}
