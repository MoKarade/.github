name: Tests de la page de graphe

# Les tests du filtre de la page de graphe (scripts/graphe-page.py) : un graphe fictif en mémoire, python3 de la machine, aucun réseau,
# aucune dépendance. Et `scripts/graphe.sh usage` sur des journaux fictifs (tâche #503) et `garde-lecture` (hook de lecture massive, tâche #840). Aucun `paths:` : un contrôle exigé filtré ne tournerait pas.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-graphe-page-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests de la page de graphe
    timeout-minutes: 5
    runs-on: ubuntu-latest # dépôt public : machines GitHub (gratuites)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test scripts/graphe-page.test.mjs scripts/graphe-usage.test.mjs scripts/graphe-garde-lecture.test.mjs scripts/impact-pr.test.mjs
