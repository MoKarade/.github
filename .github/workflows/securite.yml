name: Sécurité (workflow commun)

# Contrôle de sécurité commun aux dix dépôts, écrit UNE fois ici (plan de standardisation, décision 13).
# Appel depuis un dépôt :
#
#   jobs:
#     securite:
#       uses: MoKarade/.github/.github/workflows/securite.yml@main
#       permissions:
#         contents: read
#         security-events: write
#         actions: read
#
# Quatre contrôles, quatre jobs :
#   - secrets : gitleaks sur tous les commits de la PR (ou du push) ; rouge si un secret y est.
#   - osv     : OSV-Scanner sur le fichier de verrouillage npm ; rouge si une faille connue y est. Le binaire officiel (somme SHA-256 vérifiée), jamais
#             l'action Docker : le robot du PC (dépôts privés) n'a pas Docker.
#             Un risque accepté s'écrit dans un `osv-scanner.toml` du dépôt (ignore + raison + date).
#   - codeql  : analyse statique du code ; dépôt PUBLIC seulement (privé : sauté, GitHub l'exige payant).
#   - workflows : zizmor lit les workflows du dépôt (injection par modèle `${{ }}`, droits trop larges, jeton laissé dans `.git`,
#             cache empoisonnable). NE BLOQUE PAS (tâche #585) : il écrit ses trouvailles dans le résumé du job. Passer en bloquant
#             viendra après la correction des trouvailles, dépôt par dépôt. Exceptions voulues : securite/zizmor.yml, avec leur raison.
# Toutes les actions sont épinglées par empreinte SHA (jamais `@v4`). Les versions sont dans les
# commentaires ; Dependabot les met à jour, sauf gitleaks (binaire vérifié par somme SHA-256, voir plus bas).
on:
  workflow_call:
    inputs:
      langages:
        description: 'Langages analysés par CodeQL, séparés par des virgules.'
        type: string
        default: javascript-typescript
      dossier-verrou:
        description: 'Dossier du package-lock.json (« web » chez batchchef-).'
        type: string
        default: .

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    timeout-minutes: 10
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique : la plage de commits de la PR doit être présente
          persist-credentials: false

      - name: Installer gitleaks (version fixée, somme SHA-256 vérifiée)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Chercher des secrets dans les commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # Plage de commits : ceux de la PR ; pour un push, ceux poussés ; sinon tout l'historique.
          plage=""
          case "$EVENT" in
            pull_request|pull_request_target) plage="${PR_BASE}..${PR_HEAD}" ;;
            push)
              # Première poussée d'une branche : « before » ne contient que des zéros.
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then plage=""; else plage="${PUSH_BEFORE}..${PUSH_AFTER}"; fi ;;
          esac
          # --redact : le secret n'est jamais écrit dans le journal (il resterait lisible dans un dépôt public).
          args=(git . --redact --no-banner --exit-code 1)
          [ -n "$plage" ] && args+=(--log-opts="$plage")
          echo "Plage analysée : ${plage:-historique complet}"
          "$RUNNER_TEMP/gitleaks" "${args[@]}"

  osv:
    name: Failles connues (OSV-Scanner)
    timeout-minutes: 10
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier la présence du fichier de verrouillage
        id: verrou
        env:
          DOSSIER: ${{ inputs.dossier-verrou }}
        run: |
          if [ -f "${DOSSIER}/package-lock.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de ${DOSSIER}/package-lock.json : rien à analyser."
          fi

      # Un seul chemin, pour les dépôts publics comme privés : le binaire officiel (version fixée, somme SHA-256 vérifiée).
      # L'action `google/osv-scanner-action` n'est PAS utilisée : c'est une action Docker, et le runner tire l'image d'une
      # action Docker pendant « Set up job » même si son étape est sautée ; le robot du PC n'a pas Docker (FinanceAI, 21/10/2026).
      # Il rend 1 s'il trouve une faille, comme l'action.
      - name: Analyser les dépendances (binaire)
        if: steps.verrou.outputs.present == 'true'
        env:
          OSV_VERSION: 2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          DOSSIER: ${{ inputs.dossier-verrou }}
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile="${DOSSIER}/package-lock.json"

  workflows:
    name: Workflows (zizmor)
    timeout-minutes: 10
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Récupérer la configuration commune de zizmor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MoKarade/.github
          ref: main
          path: .securite-commune
          sparse-checkout: securite
          persist-credentials: false

      # Version fixée, installée depuis la roue PyPI dont l'empreinte SHA-256 est vérifiée par pip (--require-hashes) : même
      # exigence que gitleaks et OSV-Scanner, sans action Docker (le robot du PC n'a pas Docker). zizmor n'a aucune dépendance.
      # Pas de python3 sur la machine : la trouvaille manquante est dite dans le résumé, le job reste vert (il ne bloque pas).
      - name: Analyser les workflows (zizmor, hors ligne, sans bloquer)
        env:
          ZIZMOR_VERSION: 1.31.1
          ZIZMOR_HASH_MANYLINUX: 58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
          ZIZMOR_HASH_MUSLLINUX: e7fdf82d31cc67eb1d5030bf2372b25ee2a1c3ad05017e18da70ed138c4accd6
        run: |
          # Le shell des étapes est lancé avec -e : sans `set +e`, une panne de zizmor arrêterait l'étape avant le message ci-dessous.
          set +e
          set -u
          resume="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::notice::python3 absent de cette machine : zizmor n'a pas tourné."
            echo "zizmor n'a pas tourné : python3 absent de cette machine." >> "$resume"
            exit 0
          fi
          printf 'zizmor==%s --hash=sha256:%s --hash=sha256:%s\n' "$ZIZMOR_VERSION" "$ZIZMOR_HASH_MANYLINUX" "$ZIZMOR_HASH_MUSLLINUX" > "$RUNNER_TEMP/zizmor-exigences.txt"
          if ! python3 -m venv "$RUNNER_TEMP/zizmor-venv" || ! "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet --require-hashes -r "$RUNNER_TEMP/zizmor-exigences.txt"; then
            echo "::notice::installation de zizmor impossible sur cette machine : rien n'a été analysé."
            echo "zizmor n'a pas tourné : installation impossible sur cette machine." >> "$resume"
            exit 0
          fi
          # --no-exit-codes : une trouvaille ne fait jamais échouer le job (tâche #585).
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline --no-progress --no-exit-codes --format plain \
            --config .securite-commune/securite/zizmor.yml .github/workflows > "$RUNNER_TEMP/zizmor.txt" 2> "$RUNNER_TEMP/zizmor-journal.txt"
          code=$?
          if [ "$code" -ne 0 ]; then
            # Avec --no-exit-codes, un code non nul est une panne de l'outil (configuration illisible...), pas une trouvaille.
            echo "::warning::zizmor a échoué (code $code) : voir le résumé."
            { echo "### zizmor a échoué (code $code), rien n'est conclu"; echo '```'; head -n 40 "$RUNNER_TEMP/zizmor-journal.txt"; echo '```'; } >> "$resume"
            exit 0
          fi
          trouvailles="$(grep -cE '^(error|warning|note|help)\[' "$RUNNER_TEMP/zizmor.txt" || true)"
          echo "zizmor ${ZIZMOR_VERSION} : ${trouvailles} trouvaille(s) (non bloquant)."
          {
            echo "### zizmor ${ZIZMOR_VERSION} : ${trouvailles} trouvaille(s), non bloquant"
            echo '```'
            head -n 200 "$RUNNER_TEMP/zizmor.txt"
            echo '```'
          } >> "$resume"

  codeql:
    name: Analyse du code (CodeQL)
    # Dépôt privé : l'analyse CodeQL demande une offre payante, qu'on ne prend pas. Sauté, pas rouge.
    if: github.event.repository.private == false
    timeout-minutes: 30
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ inputs.langages }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ inputs.langages }}
