name: Sécurité (workflow commun)

# Contrôle de sécurité commun aux dix dépôts, écrit UNE fois ici (plan de standardisation, décision 13).
# Appel depuis un dépôt :
#
#   jobs:
#     securite:
#       uses: MoKarade/.github/.github/workflows/securite.yml@main
#       permissions:
#         contents: read
#         security-events: write
#         actions: read
#
# Trois contrôles, trois jobs :
#   - secrets : gitleaks sur tous les commits de la PR (ou du push) ; rouge si un secret y est.
#   - osv     : OSV-Scanner sur le fichier de verrouillage npm ; rouge si une faille connue y est. Dépôt public : l'action Docker ;
#             dépôt privé : le même outil en binaire vérifié (le robot du PC n'a pas Docker).
#             Un risque accepté s'écrit dans un `osv-scanner.toml` du dépôt (ignore + raison + date).
#   - codeql  : analyse statique du code ; dépôt PUBLIC seulement (privé : sauté, GitHub l'exige payant).
# Toutes les actions sont épinglées par empreinte SHA (jamais `@v4`). Les versions sont dans les
# commentaires ; Dependabot les met à jour, sauf gitleaks (binaire vérifié par somme SHA-256, voir plus bas).
on:
  workflow_call:
    inputs:
      langages:
        description: 'Langages analysés par CodeQL, séparés par des virgules.'
        type: string
        default: javascript-typescript
      dossier-verrou:
        description: 'Dossier du package-lock.json (« web » chez batchchef-).'
        type: string
        default: .

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    timeout-minutes: 10
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique : la plage de commits de la PR doit être présente
          persist-credentials: false

      - name: Installer gitleaks (version fixée, somme SHA-256 vérifiée)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Chercher des secrets dans les commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # Plage de commits : ceux de la PR ; pour un push, ceux poussés ; sinon tout l'historique.
          plage=""
          case "$EVENT" in
            pull_request|pull_request_target) plage="${PR_BASE}..${PR_HEAD}" ;;
            push)
              # Première poussée d'une branche : « before » ne contient que des zéros.
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then plage=""; else plage="${PUSH_BEFORE}..${PUSH_AFTER}"; fi ;;
          esac
          # --redact : le secret n'est jamais écrit dans le journal (il resterait lisible dans un dépôt public).
          args=(git . --redact --no-banner --exit-code 1)
          [ -n "$plage" ] && args+=(--log-opts="$plage")
          echo "Plage analysée : ${plage:-historique complet}"
          "$RUNNER_TEMP/gitleaks" "${args[@]}"

  osv:
    name: Failles connues (OSV-Scanner)
    timeout-minutes: 10
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier la présence du fichier de verrouillage
        id: verrou
        env:
          DOSSIER: ${{ inputs.dossier-verrou }}
        run: |
          if [ -f "${DOSSIER}/package-lock.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de ${DOSSIER}/package-lock.json : rien à analyser."
          fi

      - name: Analyser les dépendances
        if: steps.verrou.outputs.present == 'true' && github.event.repository.visibility == 'public'
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=${{ inputs.dossier-verrou }}/package-lock.json

      # Dépôt privé : le robot du PC n'a pas Docker, or l'action ci-dessus en est une. Même outil, même version (2.7.0),
      # en binaire dont la somme SHA-256 est vérifiée ; il rend 1 s'il trouve une faille, comme l'action.
      - name: Analyser les dépendances (binaire, dépôt privé)
        if: steps.verrou.outputs.present == 'true' && github.event.repository.visibility != 'public'
        env:
          OSV_VERSION: 2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          DOSSIER: ${{ inputs.dossier-verrou }}
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile="${DOSSIER}/package-lock.json"

  codeql:
    name: Analyse du code (CodeQL)
    # Dépôt privé : l'analyse CodeQL demande une offre payante, qu'on ne prend pas. Sauté, pas rouge.
    if: github.event.repository.private == false
    timeout-minutes: 30
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","pc-marc"]') }} # dépôt public : machines GitHub (gratuites) ; privé : robot du PC
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ inputs.langages }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ inputs.langages }}
