name: Tests du garde-fou de preuve

# Les tests du garde-fou de preuve (scripts/preuve.mjs) : une fausse API GitHub en mémoire, aucun réseau,
# aucune dépendance. Aucun `paths:` : un contrôle exigé filtré ne tournerait pas.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-preuve-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests du garde-fou de preuve
    timeout-minutes: 5
    runs-on: ubuntu-latest # dépôt public : machines GitHub (gratuites)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test scripts/preuve.test.mjs scripts/acceptation-auto.test.mjs scripts/preuve-attendue-auto.test.mjs scripts/preuve-commentaire.test.mjs scripts/fini-quand.test.mjs
