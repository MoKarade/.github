name: Tests du réveil du Coordinateur

# Les tests du réveil sans IA (scripts/reveil-reacteur.mjs), de la file d'un dépôt calculée à l'événement (scripts/file-depot.mjs) du pilotage des tâches et de Jules à l'événement (scripts/pilotage-evenement.mjs) et du filet porté par le PC (scripts/filet-pc.mjs, avec ses modules jules-*, lier-taches et fichiers-touches) : une fausse API GitHub en mémoire, aucun réseau,
# aucune dépendance. Aucun `paths:` : un contrôle exigé filtré ne tournerait pas.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-reveil-reacteur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests du réveil du Coordinateur
    timeout-minutes: 5
    runs-on: ubuntu-latest # dépôt public : machines GitHub (gratuites)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test scripts/reveil-reacteur.test.mjs scripts/auteur-de-confiance.test.mjs scripts/filet-pc.test.mjs scripts/jules-suivi.test.mjs scripts/lier-taches.test.mjs scripts/fichiers-touches.test.mjs scripts/file-depot.test.mjs scripts/pilotage-evenement.test.mjs scripts/place-immobile.test.mjs scripts/dependants-autres-depots.test.mjs
