name: Surveillance des apps

# Alerte quand une app tombe (plan de standardisation, décision 11). Un passage par jour (filet) et à chaque
# événement `fumee-rouge`, sonde `/api/sante` de chaque app listée dans surveillance/apps.json (l'état courant est mesuré
# toutes les 5 minutes par UptimeRobot, tâche .github#617). Une app muette après 3 essais ouvre UNE issue `panne`
# dans ce dépôt (notification GitHub) ; son retour la ferme avec un commentaire. Les journaux Vercel Hobby
# ne vivent qu'1 h : cette sonde externe est la seule trace d'une panne de nuit.
# Le jeton du job (github.token, droits limités à ce dépôt) sert au seul CLI `gh` ; aucun secret du dépôt.
#
# Même passage : le dernier déploiement de production de chaque app (état GitHub publié par Vercel). Un échec
# ouvre une issue `panne` « Déploiement en échec : <app> », le déploiement suivant réussi la ferme (tâche #60).
# Un dépôt que le jeton du job ne lit pas (privé) est « non mesuré » dans le résumé, jamais un faux vert.
#
# Tâche #30 : si une app dont la santé est rouge a un projet Vercel déclaré (`vercel` dans surveillance/apps.json)
# et que sa panne suit un déploiement récent, la version précédente est remise en ligne et une issue `incident` est
# ouverte (scripts/retour-arriere.mjs). Seul pas qui lit un secret du dépôt : VERCEL_TOKEN. Sans lui, ce pas est
# inactif et le dit dans le résumé.
#
# Lancement d'essai (preuve « une panne ouvre l'issue, le retour la ferme ») : « Run workflow » avec
# un nom et une URL de santé ; seule cette app simulée est sondée. Avec `retour-essai` (un projet Vercel d'essai),
# le retour en arrière est aussi exercé pour de vrai sur ce seul projet. Pour l'échec de déploiement : choisir
# `echec` puis `succes` dans « deploiement-essai » (un déploiement simulé, rien n'est lu chez Vercel).
on:
  # Événement `fumee-rouge` : envoyé par le workflow commun fumee.yml quand la fumée de production d'une app est
  # rouge (scripts/demander-retour.mjs, secret HUB_DISPATCH_TOKEN des dépôts d'apps). Le retour en arrière ne
  # traite alors que l'app de l'URL reçue ; sa propre sonde décide encore.
  repository_dispatch:
    types: [fumee-rouge]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      nom-essai:
        description: 'Nom de l’app simulée (minuscules, chiffres, tirets)'
        required: false
        default: essai
      url-essai:
        description: 'URL https de santé de l’app simulée (vide : surveillance normale)'
        required: false
        default: ''
      deploiement-essai:
        description: 'Simuler le dernier déploiement de production de l’app d’essai : echec ou succes (vide : surveillance normale)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - echec
          - succes
      retour-controle:
        description: 'Contrôle en lecture seule du retour en arrière : lit Vercel pour chaque app et dit si la version précédente est prête (rien n’est changé)'
        required: false
        default: false
        type: boolean
      retour-essai:
        description: 'Essai du retour en arrière : nom d’un projet Vercel d’essai, utilisé avec url-essai (vide : aucune app n’est touchée en lancement d’essai)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

# Un seul passage à la fois : deux passages en parallèle ouvriraient deux issues pour la même panne.
concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  surveillance:
    name: Surveillance
    timeout-minutes: 10
    runs-on: ubuntu-latest # dépôt public : machines GitHub (gratuites)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Sonder les apps et tenir les issues de panne
        if: ${{ !inputs.deploiement-essai }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SURVEILLANCE_ESSAI_NOM: ${{ inputs.nom-essai }}
          SURVEILLANCE_ESSAI_URL: ${{ inputs.url-essai }}
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: node scripts/surveillance.mjs

      - name: Relever les déploiements de production et tenir les issues d'échec
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SURVEILLANCE_ESSAI_NOM: ${{ inputs.nom-essai }}
          DEPLOIEMENT_ESSAI: ${{ inputs.deploiement-essai }}
        run: node scripts/deploiements.mjs

      - name: Remettre la version précédente si une app tombe après un déploiement
        if: ${{ !cancelled() && !inputs.deploiement-essai }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SURVEILLANCE_ESSAI_NOM: ${{ inputs.nom-essai }}
          SURVEILLANCE_ESSAI_URL: ${{ inputs.url-essai }}
          RETOUR_ESSAI_VERCEL: ${{ inputs.retour-essai }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_EQUIPE: mokarades-projects
          RETOUR_CONTROLE: ${{ inputs.retour-controle }}
          RETOUR_URL_BASE: ${{ github.event.client_payload.url_base }}
        run: node scripts/retour-arriere.mjs

      - name: Détecter les nouveaux modèles Anthropic et ouvrir les tâches de migration
        if: ${{ !cancelled() && !inputs.deploiement-essai && !inputs.url-essai }}
        env:
          GH_PAT: ${{ secrets.RELECTURE_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/modeles-nouveaux.mjs
