name: Essai de la fumée

# Lancement à la main de la fumée commune contre une URL donnée : sert à vérifier le workflow lui-même
# (vert contre une app en ligne, rouge contre une URL cassée) sans attendre un déploiement.
on:
  workflow_dispatch:
    inputs:
      url-base:
        description: 'URL en https à sonder'
        required: true
      chemin-summary:
        description: 'Route du summary (vide : pas de contrôle summary)'
        default: ''
        required: false

permissions:
  contents: read

jobs:
  fumee:
    uses: ./.github/workflows/fumee.yml
    with:
      url-base: ${{ inputs.url-base }}
      chemin-summary: ${{ inputs.chemin-summary }}
