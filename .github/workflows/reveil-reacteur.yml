name: Réacteur (workflow commun)

# Remplace la routine « Réacteur » (session Claude lancée à chaque événement, donc du quota). Écrit UNE fois ici ;
# le `reacteur.yml` de chaque dépôt l'appelle quand une PR est fusionnée, quand la CI devient rouge, quand une
# tâche est fermée ET prouvée, etc. (docs/cycle-de-vie-tache.md §6). Depuis le nettoyage du 29/10/2026 il ne réveille plus le Coordinateur ni
# les fils d'app : il accepte seul ce qui se prouve par une machine, lance les balayages de `.github`, relance un échec de charge du robot
# et réveille le Coordinateur (signaux du pilotage). La routine « Prendre une tâche » et la file des tâches sont retirées (voie courte, 29/10/2026).
# Tâches : MoKarade/.github#139 (événements) et #143 (filet).
#
#   reveiller:
#     needs: preuve
#     if: <PR fusionnée, CI rouge d'un humain, ou tâche prouvée>
#     permissions: { contents: read, pull-requests: write, issues: write, checks: read, actions: write, deployments: read }
#     uses: MoKarade/.github/.github/workflows/reveil-reacteur.yml@main
#     secrets: inherit
#     with:
#       runner: ${{ github.event.repository.visibility == 'public' && '"ubuntu-latest"' || '["self-hosted","pc-marc"]' }}
#       type: ${{ github.event_name == 'pull_request' && 'pr_fusionnee' || github.event_name == 'issues' && 'tache_fermee' || github.event_name == 'workflow_run' && (github.event.workflow_run.name == 'Garde-fou' && 'garde_fou_rouge' || 'ci_rouge') || 'filet' }}
#       ...
#
# `pr_fusionnee` tente d'abord l'acceptation automatique de la tâche citée (scripts/acceptation-auto.mjs, cycle de vie §10 ter) : elle
# écrit sur l'issue et sur la PR et lit les déploiements, donc le `reacteur.yml` appelant doit donner `issues: write`,
# `pull-requests: write` (le commentaire « Fusionnée et acceptée automatiquement » de la PR) et `deployments: read` (sans les
# deux premiers : un avertissement, jamais un échec, et un fil prouve la tâche comme avant ; MoKarade/.github#418).
#
# `garde_fou_rouge` (le workflow `Garde-fou` de la PR vient de finir en échec) ne réveille personne : il lance seulement
# `relecture-ia.yml` de `.github`, qui n'a plus de minuteur (MoKarade/.github#633). Le `reacteur.yml` appelant écoute alors
# `workflow_run: workflows: [CI, Garde-fou]` et envoie ce type quand `github.event.workflow_run.name == 'Garde-fou'`.
#
# `pr_ouverte` (PR ouverte, rouverte, sortie du brouillon ou dont le corps change) ne réveille personne : elle lance seulement le
# commentaire tâche liée, qui marque la tâche citée `en-cours` (MoKarade/.github#157).
#
# La logique est dans scripts/reveil-reacteur.mjs (testée, sans dépendance, sans IA) ; ce fichier ne fait que
# l'appeler. Le script vient de ce dépôt, jamais du code de l'appelant. Pour les signaux du pilotage il lance
# `boite-reacteur.yml` d'app-template, qui commente la boîte du Coordinateur en bot.
# Jeton : `REVEIL_TOKEN`, jeton fin de Marc (Actions : lecture et écriture), posé comme secret dans les dix dépôts : il lance aussi les balayages
# de `.github`. Sans lui le job le dit par un avertissement.
# Le jeton du job (`github.token`) lit le dépôt appelant et relance ses jobs en échec ; il ne sort jamais du script.
on:
  workflow_call:
    inputs:
      runner:
        description: 'Machine, en JSON : "ubuntu-latest" (dépôt public) ou ["self-hosted","pc-marc"] (dépôt privé).'
        type: string
        default: '"ubuntu-latest"'
      type:
        description: 'pr_fusionnee | pr_ouverte | tache_fermee | tache_ouverte | deploiement | preuve_page | commentaire | fin_de_cron | note_lia | ci_rouge | garde_fou_rouge | filet'
        type: string
        required: true
      depot:
        description: 'Dépôt appelant (MoKarade/nom).'
        type: string
        required: true
      pr:
        description: 'Numéro de la PR (fusionnée, ou en CI rouge).'
        type: string
        default: ''
      issue:
        description: 'Numéro de l’issue fermée.'
        type: string
        default: ''
      raison:
        description: 'Raison de fermeture de l’issue (completed, not_planned).'
        type: string
        default: ''
      evenement:
        description: 'Événement de la CI rouge (pull_request, push, schedule).'
        type: string
        default: ''
      sha:
        description: 'Empreinte du commit de la CI rouge ou du déploiement réussi.'
        type: string
        default: ''
      run:
        description: 'Identifiant du run CI rouge.'
        type: string
        default: ''
      branche-run:
        description: 'Branche du run CI rouge.'
        type: string
        default: ''
      branche-defaut:
        description: 'Branche par défaut du dépôt appelant.'
        type: string
        default: main
      signal:
        description: 'Identifiant envoyé par une app (note LIA, fin de cron) ; le script ne garde que lettres, chiffres, point, tiret, souligné.'
        type: string
        default: ''
      forcer:
        description: 'true : repose un signal du pilotage même s’il est déjà sur la boîte depuis moins de 6 h (lancement manuel, essais).'
        type: string
        default: ''
      deploiement:
        description: 'Comme le garde-fou de preuve : vercel (défaut, une PR qui change du servi attend son déploiement) ou aucun (dépôt qui ne se déploie pas). Sert à l’acceptation automatique d’une PR fusionnée.'
        type: string
        default: vercel
      workflows-deploiement:
        description: 'Workflows qui déploient hors Vercel (ex. deploy.yml), séparés par des virgules. Sert à l’acceptation automatique.'
        type: string
        default: ''
    secrets:
      REVEIL_TOKEN:
        description: 'Jeton fin limité à app-template (Actions : lecture et écriture).'
        required: false

permissions: {}

jobs:
  reveiller:
    name: Réveiller le Coordinateur
    # Plafond : un job figé ne doit pas tourner six heures. Quelques secondes ; jusqu'à ~3 min quand une PR fusionnée change du code
    # servi et que l'acceptation automatique attend son déploiement (4 essais, 45 s entre, scripts/acceptation-auto.mjs).
    timeout-minutes: 8
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: write
      deployments: read
    steps:
      - name: Récupérer le script de réveil
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MoKarade/.github
          ref: main
          path: .reveil
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Décider, relancer ou lancer (sans IA)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVEIL_TOKEN: ${{ secrets.REVEIL_TOKEN }}
          REVEIL_TYPE: ${{ inputs.type }}
          REVEIL_DEPOT: ${{ inputs.depot }}
          REVEIL_PR: ${{ inputs.pr }}
          REVEIL_ISSUE: ${{ inputs.issue }}
          REVEIL_RAISON: ${{ inputs.raison }}
          REVEIL_EVENEMENT: ${{ inputs.evenement }}
          REVEIL_SHA: ${{ inputs.sha }}
          REVEIL_RUN: ${{ inputs.run }}
          REVEIL_BRANCHE_RUN: ${{ inputs.branche-run }}
          REVEIL_BRANCHE_DEFAUT: ${{ inputs.branche-defaut }}
          REVEIL_FORCER: ${{ inputs.forcer }}
          REVEIL_SIGNAL: ${{ inputs.signal }}
          REVEIL_DEPLOIEMENT: ${{ inputs.deploiement }}
          REVEIL_WORKFLOWS: ${{ inputs.workflows-deploiement }}
        run: node .reveil/scripts/reveil-reacteur.mjs
