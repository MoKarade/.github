name: Geste de Marc

# Contrôle d'un geste réclamé à Marc (scripts/geste-controle.mjs, tâche MoKarade/.github#706, mission #703).
# Quand l'étiquette `qui:marc` est posée sur une tâche de ce dépôt, le script vérifie qu'elle porte une ligne `Geste : …` ET une ligne
# `Pourquoi lui seul : …` (corps ou commentaire). Sinon : UN commentaire qui le dit et l'étiquette `geste-incomplet`, jamais de retrait de `qui:marc`.
# Aucun minuteur : un événement. Les tâches des autres dépôts sont lues par le rapport hebdomadaire (gestes ouverts depuis plus de 7 jours, avec leur raison).
# SÛRETÉ : le déclencheur `issues` s'exécute avec le fichier de la branche par défaut ; l'événement est lu par le script comme une donnée
# (GITHUB_EVENT_PATH), jamais collé dans une commande ; un échec est un avertissement, jamais un job rouge.
on:
  issues:
    types: [labeled]

# Aucun `paths:` : la règle vaut partout ici.
permissions:
  contents: read
  issues: write

concurrency:
  group: geste-controle-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  controler:
    name: Geste de Marc
    # Étiquettes autres que qui:marc : le job ne démarre même pas (pas de minutes pour rien).
    if: github.event.label.name == 'qui:marc'
    timeout-minutes: 2
    runs-on: ubuntu-latest # dépôt public : machines GitHub (gratuites)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Contrôler le geste
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/geste-controle.mjs
