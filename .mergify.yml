# Fusion automatique par Mergify pour MoKarade/.github (oui écrit de Marc, 15/10/2026, fil « fusion automatique »).
# Une PR prête (pas en brouillon, sans l'étiquette « hold ») est fusionnée en squash quand le contrôle
# « Garde-fou » et les tests du garde-fou sont verts. Hors chemins protégés (docs/, README) le garde-fou
# est vert d'office ; sur .github/ il bloque les cas dangereux (test retiré, secret, ...) et ouvre une
# issue `qui:marc`. Ce fichier et le garde-fou ne se modifient pas seuls : Marc les fusionne.
queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    # Sans cette ligne Mergify calcule le délai (`auto`) d'après la durée récente des contrôles de la file :
    # environ une minute ici, alors que le CI de la file en prend près de deux, d'où des PR vertes sorties de la file (« Checks timed out »).
    checks_timeout: 30 min
    queue_conditions:
      - base = main
      - -draft
      - label != hold
      - 'check-success = Garde-fou'
      - 'check-success = Tests du garde-fou'
    merge_conditions:
      - label != hold
      - 'check-success = Garde-fou'
      - 'check-success = Tests du garde-fou'
merge_protections_settings:
  auto_merge_conditions:
    - base = main
    - -draft
    - label != hold
    - 'check-success = Garde-fou'
